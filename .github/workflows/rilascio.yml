# Ogni volta che su main arriva una versione nuova (il <Version> di Directory.Build.props) GitHub fa le prove,
# compila, impacchetta con Velopack e pubblica la release vX.Y.Z con Setup.exe, portatile e i pacchetti per gli
# aggiornamenti automatici. Le prove devono passare: se sono rosse la release non esce. LibreOffice e le estensioni
# HEIF sui runner non ci sono: quelle prove, se il pezzo manca, escono da sole (non sono un fallimento).
name: Rilascio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rilascio
  cancel-in-progress: false

jobs:
  rilascio:
    runs-on: windows-latest
    env:
      # la chiave che firma il pacchetto del menu di Windows 11 (la parte pubblica è risorse/DaProdProduzioni-firma.cer)
      DAP_FIRMA_PFX: ${{ secrets.DAP_FIRMA_PFX }}
      DAP_FIRMA_PASSWORD: ${{ secrets.DAP_FIRMA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Versione
        id: versione
        shell: pwsh
        run: |
          [xml]$p = Get-Content Directory.Build.props
          $v = $p.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "numero=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { "esiste=si" >> $env:GITHUB_OUTPUT; Write-Host "La v$v c'è già: niente da pubblicare" } else { "esiste=no" >> $env:GITHUB_OUTPUT }
          # "release non trovata" lascia il codice 1, e Actions chiuderebbe il passo come fallito
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: FFmpeg
        shell: pwsh
        run: ./scripts/prendi-ffmpeg.ps1

      - name: 7-Zip
        shell: pwsh
        run: ./scripts/prendi-7zip.ps1

      - name: Menu di Windows 11
        shell: pwsh
        run: ./scripts/compila-menu.ps1

      - name: Prove
        shell: pwsh
        run: dotnet test test/DaPConvertitore.Prove -nologo

      - name: Pacchetto
        if: steps.versione.outputs.esiste == 'no'
        shell: pwsh
        run: |
          dotnet tool restore
          # la release prima, se c'è: Velopack ne ricava l'aggiornamento "delta" (scarichi solo la differenza)
          dotnet vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ github.token }} -o Releases
          ./scripts/pacchetto.ps1

      - name: Pubblica
        if: steps.versione.outputs.esiste == 'no'
        shell: pwsh
        run: |
          $v = "${{ steps.versione.outputs.numero }}"
          dotnet vpk upload github --repoUrl https://github.com/${{ github.repository }} --token ${{ github.token }} `
            -o Releases --publish --releaseName "DaP Convertitore $v" --tag "v$v"

  linux:
    needs: rilascio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: FFmpeg
        run: chmod +x scripts/prendi-ffmpeg-linux.sh && ./scripts/prendi-ffmpeg-linux.sh

      - name: 7-Zip
        run: chmod +x scripts/prendi-7zip-linux.sh && ./scripts/prendi-7zip-linux.sh

      - name: Interfaccia
        working-directory: ui
        run: |
          if [ ! -d node_modules ]; then npm ci --no-audit --no-fund; fi
          npm run build

      - name: AppImage
        run: chmod +x linux/appimage.sh && ./linux/appimage.sh

      - name: Pubblica l'AppImage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props | head -1)
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$v" Releases/DaPConvertitore-linux.AppImage --clobber --repo "$GITHUB_REPOSITORY"
          else
            echo "La release v$v non c'è (versione già pubblicata o prove fallite): non carico l'AppImage"
          fi
